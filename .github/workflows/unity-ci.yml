# Mitzi — Unity otomatik derleme (GameCI)
#
# compile : Her PR'da ve main'e her push'ta çalışır. Proje Unity'de açılır, tüm
#           editör + oyun scriptleri derlenir ve hızlı bir Linux oyuncu derlemesi
#           alınır. Derleme hatası varsa PR'da kırmızı ✗ görünür.
# android : Elle (Actions → Unity CI → Run workflow) veya main'e push'ta çalışır.
#           Google Play'e yüklenecek .aab dosyasını üretir ve indirilebilir bırakır.
#
# Gerekli repo secret'ları (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE   Unity_lic.ulf dosyasının tüm içeriği
#   UNITY_EMAIL     Unity hesabının e-postası
#   UNITY_PASSWORD  Unity hesabının şifresi
# İsteğe bağlı (imzalı release .aab için; yoksa debug imzasıyla derlenir):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS

name: Unity CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android:
        description: "Android .aab de üretilsin mi?"
        type: boolean
        default: true

concurrency:
  group: unity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  compile:
    name: Derleme kontrolü
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Unity secret'larını kontrol et
        run: |
          missing=""
          [ -z "$UNITY_LICENSE" ] && missing="$missing UNITY_LICENSE"
          [ -z "$UNITY_EMAIL" ] && missing="$missing UNITY_EMAIL"
          [ -z "$UNITY_PASSWORD" ] && missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Eksik secret:$missing. Kurulum için .github/CI_SETUP.md dosyasına bak."
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Library önbelleği
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Linux-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Linux-

      # Linux Mono oyuncu derlemesi: hem editör scriptlerini hem de oyun kodunu
      # (UNITY_EDITOR dışı #if dalları dahil) derler; Android'e göre çok daha hızlıdır.
      - name: Scriptleri derle (Linux oyuncu)
        uses: game-ci/unity-builder@v5
        with:
          targetPlatform: StandaloneLinux64
          buildName: Mitzi
          # Sürüm numarası Player Settings'ten (bundleVersion) alınır.
          versioning: None

  android:
    name: Android App Bundle (.aab)
    needs: compile
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.android)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Android imajı büyük (IL2CPP + SDK/NDK); runner'da yer açıyoruz.
      - name: Disk alanı aç
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Library önbelleği
        uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Android-

      - name: Keystore'u hazırla (varsa)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Dosyayı unity-builder kendisi çözüp projeye yazar; burada yalnız adını veriyoruz.
          if [ -n "$KEYSTORE_B64" ]; then
            echo "name=mitzi-release.keystore" >> "$GITHUB_OUTPUT"
            echo "Release keystore ile imzalanacak."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 yok; .aab debug imzasıyla derlenecek (Play'e yüklenemez, test içindir)."
          fi

      - name: Android derlemesi
        uses: game-ci/unity-builder@v5
        with:
          targetPlatform: Android
          buildName: Mitzi
          versioning: None
          androidExportType: androidAppBundle
          # Her CI derlemesine artan bir versionCode verir.
          androidVersionCode: ${{ github.run_number }}
          androidKeystoreName: ${{ steps.keystore.outputs.name }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: .aab dosyasını yükle
        uses: actions/upload-artifact@v7
        with:
          name: Mitzi-Android-${{ github.run_number }}
          path: build/Android
          retention-days: 14
